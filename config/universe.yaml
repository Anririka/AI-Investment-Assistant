# layer2_analysis_design.md §3-8の確定仕様どおり。screener.py（母集団フィルタリング）が使用する。
#
# 2026-07-26更新：日経225（225銘柄）・S&P500（503銘柄、複数株式クラス込み）の実際の構成銘柄
# リストに差し替えた（項目6「残作業一覧」対応）。
#
# 情報源・確定方法：Wikipedia「List of S&P 500 companies」、topforeignstocks.com（Nikkei 225
# 構成銘柄、ベースは2024年1月時点のスナップショットと判明）を軸に、日経公式サイト
# （indexes.nikkei.co.jp）の構成銘柄変更履歴PDF・Nikkei Asia・Bloomberg・JPX公式発表等の
# 一次情報で2024年1月以降の入替（計12件：定期入替8件＋臨時入替4件）を反映済み。ユーザーによる
# SBI証券画面でのスポットチェックを経て確定（詳細はnikkei225_changes_summary.mdを参照、
# セッション履歴に添付済み）。
#
# 銘柄コード形式：日本株は4桁（一部アルファベット含む新形式、例"285A"）のJPXコード（末尾の
# ".T"サフィックスは付けない。jquants.py等のRepository実装が生のコードをそのまま
# クエリパラメータへ渡す契約のため）。米国株はティッカーシンボルそのまま（例"BRK.B"の
# ようなクラス株の表記はWikipedia基準。実際のAPIレスポンスでの表記揺れ（"BRK-B"等）は
# 未検証、該当銘柄で取得失敗した場合は1銘柄のみ除外される設計のため運用に支障はない）。
#
# 2段階スクリーニング方式（ユーザー合意済み、項目6）：725銘柄全体に対して価格＋
# ファンダメンタルの両方を毎朝取得すると、Alpha Vantageの25回/日制限を広域スクリーニング
# だけで使い切ってしまう（config/api_sources.yamlのus_equity_bulk_priceチェーン・
# layer1_data_acquisition_design.md §6-2参照）。そのため、scripts/run_daily_pipeline.pyは
# まず本ファイルの725銘柄全体を対象に「価格データのみ」の第1段階スクリーニング
# （layer2_analysis/stage1_screener.py、流動性フィルタ＋テクニカルスコアランキング）を行い、
# 各資産クラスで`stage1_shortlist_size`件に絞り込んだ上で、従来通りの詳細フェッチ
# （価格＋ファンダメンタル取得、Alpha Vantage含む）を行う第2段階に渡す。

