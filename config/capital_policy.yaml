# 投資可能資金ポリシー（新設・Layer5固有の運用設定）。
#
# layer5_ai_judgment_design.md §8のposition_sizer.py算出式は「投資可能資金（設計上は
# 300万円）× 33%」という恒久設計値を前提に書かれている。本ファイルは、その「投資可能
# 資金」そのものの実際の値を人手で確定させるための設定であり、設計書の割合ベースの
# ルール（1銘柄33%上限・-10%損切り等）そのものは一切変更しない。
#
# 重要（2026-07、ユーザー明示確認事項）：
# 初期の信頼検証期間中は、恒久設計値である300万円ではなく、ユーザーが指定した
# 25万円のみを実際の投資可能資金として使う。理由：まず推奨銘柄を信頼してよいかを
# 少額で確認したいというユーザーの意向（初回投資額を抑えたい）による。
#
# この上限はAIが自動調整するものではない。test_phase.enabled を false に戻すか、
# 本ファイルの値を人手で書き換えない限り、恒久値（300万円）には自動的に移行しない
# （load_portfolio_state.pyのresolve_total_capital()参照）。
#
# 期間（2026-07、ユーザー明示確認事項・追加）：
# 初回のみではなく「最初の1か月」をこの上限ありの設定で運用する。起点は実装日
# （config反映日）ではなく、「Layer5の実運用テストを実際に開始した日」とする。
# planned_start_date／planned_end_date／planned_duration_daysは、あくまで人間向けの
# 目安・記録用のフィールドである。resolve_total_capital()はこれらの日付を一切参照
# しない（=期限が来ても自動的にfalseへは切り替わらない）。上限の解除・金額変更・
# 期間の延長は、必ず人間がenabled／total_capitalを直接編集して判断する。
#
# planned_start_date／planned_end_date（2026-07-26追記）：
# 2026-07-26、Layer5〜Layer7の実データ初回検証（Google Driveコネクタ経由での接続・
# 提案生成・提案トラッキング）が実際に成功したことをもって、Layer5の実運用テスト
# 開始日と確定し、以下に記入した。前述の通りresolve_total_capital()はこれらの日付を
# 一切参照しないため、この記入自体が自動的な期限管理をもたらすものではない
# （期間終了後の恒久値への移行判断は、必ず人間がenabled／total_capitalを直接編集して
# 行うこと）。
#
# 2026-08-09訂正（実運用開始に伴うユーザーとの認識合わせ）：
# 上記test_phaseは「投資可能資金の総額」を25万円に絞る設定として実装していたが、
# これはユーザーの実際の意図と異なっていた。ユーザーの余剰資金自体は当初の恒久設計
# 通り300万円あり、絞りたかったのは総額ではなく「システム稼働直後のリスク低減の
# ため、しばらくの間は1銘柄あたりの購入金額を25万円以下に抑えたい」という、
# 1銘柄単位の上限だった。そのため、投資可能資金の総額はtest_phase.enabled: falseと
# して恒久値（300万円）を使うよう変更し、25万円という値は新設のper_position_cap
# （1銘柄あたりの一時的な絶対額上限、下記）へ移した。position_sizer.pyの1銘柄あたり
# 投資上限は、従来通りのtotal_capital×33%（=300万円×33%=99万円）とper_position_cap.
# max_amountの小さい方が採用されるため、実質的に25万円が上限として機能する
# （load_portfolio_state.resolve_absolute_per_position_cap()・position_sizer.
# size_position()参照）。test_phaseセクション自体は将来「総額そのもの」を絞る
# 正当な理由が生じた場合のために残すが、現在は使用しない（enabled: false）。
full_scale:
  total_capital: 3000000

test_phase:
  enabled: false
  total_capital: 250000
  planned_duration_days: 30
  planned_start_date: "2026-07-26"
  planned_end_date: "2026-08-25"    # planned_start_dateの30日後（目安・記録用）
  note: >
    2026-08-09時点で無効化（enabled: false）。投資可能資金の「総額」を絞る目的では
    使わないこととした（1銘柄あたりの上限はper_position_capを参照）。ユーザーが
    将来「総額そのもの」を絞りたい正当な理由が生じた場合のために、フィールド自体は
    残してある。

# 2026-08-09追加：1銘柄あたりの購入金額の一時的な絶対額上限（円）。投資可能資金の
# 総額（total_capital、上記）とは独立した別軸の制約。position_sizer.size_position()が
# total_capital×33%とこのmax_amountの小さい方を1銘柄あたりの上限として採用する。
per_position_cap:
  enabled: true
  max_amount: 250000
  planned_duration_days: 30
  planned_start_date: "2026-08-09"
  planned_end_date: "2026-09-08"    # planned_start_dateの30日後（目安・記録用）
  note: >
    システム稼働直後のリスク低減のための、1銘柄あたり購入金額の一時的な絶対額上限
    （ユーザー明示確認事項、2026-08-09）。投資可能資金の総額（300万円）自体は
    制限しない。この上限の解除・金額変更・期間の延長は、必ず人間がenabled／
    max_amountを直接編集して判断する（コード側での自動切替・自動延長は一切行わない、
    total_capitalのtest_phaseと同じ運用方針）。
