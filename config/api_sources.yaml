# RepositoryFactory設定ファイル（layer1_data_acquisition_design.md §3-2, §3-3 の確定仕様どおり）
#
# データ種別ごとに、どの具体Repositoryを・どの優先順位で・キャッシュ有無をどう設定してチェーンに
# 組み込むかを定義する。新しいデータソースを追加する場合、対応する具体Repositoryクラスを1つ実装し、
# 本ファイルに1行追記するだけで済み、他のコードは変更不要（layer1_data_acquisition_design.md §3-2）。
#
# 実際のキー・トークンはここには書かず、環境変数／GitHub Secrets経由で各Repository実装に渡す
# （.env.example参照）。

japan_equity:
  chain:
    - name: jquants
      plan: light            # free / light / standard / premium（Light加入済み、§8の移行手順どおりplanのみ変更）
      price_delay_weeks: 0    # Lightプランのため遅延なし
      rate_limit_per_minute: 60
      api_version: v2         # V2 APIキー方式（x-api-keyヘッダー）。V1のmailaddress/password認証は使用しない
    - name: web_search_fallback
      note: "個別TSE銘柄の当日データはカバレッジ不安定。取得成功でもdata_quality_gateで要検証扱い"

us_equity:
  chain:
    - name: alpha_vantage
      rate_limit_per_day: 25
      rate_limit_per_minute: 5
      reserved_for: ["earnings_surprise", "final_candidates_detail"]
    - name: twelve_data
      rate_limit_per_day: 800
      # 2026-07-26追加：Twelve Data公式サイト（twelvedata.com/pricing）で確認したBasic
      # （無料）プランの実際の上限は「8クレジット/分（800/日）」であり、rate_limit_per_day
      # だけでは分あたりの実際の制約を表せていなかった（factory.pyはrate_limit_per_minuteが
      # 設定されているエントリのみRateLimiterを組み込む契約のため、この行が無いと分あたりの
      # 実制限を一切守らずリクエストを送ってしまい、725銘柄規模の第1段階運用では大半が
      # 429エラーになる）。get_daily_prices（time_series）は1クレジット/回のため、
      # 8回/分＝1回あたり7.5秒間隔で呼び出す。
      rate_limit_per_minute: 8
      role: "primary_bulk_scan"

# 2026-07-26追加：config/universe.yamlをS&P500全構成銘柄（503件）に差し替えたことに伴う
# 第1段階（広域・価格データのみ）スクリーニング専用チェーン
# （scripts/run_daily_pipeline.py・layer2_analysis/stage1_screener.py参照）。
#
# us_equityチェーンをそのまま使うと、先頭候補のalpha_vantage（25回/日、
# reserved_for: final_candidates_detailの通り本来は絞り込み後の最終候補用に予約された枠）を
# 503銘柄の一次スクリーニングだけで即座に使い切ってしまう。twelve_data単独（800回/日、
# role: primary_bulk_scanの通りそもそも「広範なスクリーニングの主力」として設計されている、
# repositories/twelve_data.pyのdocstring参照）のチェーンを別途用意することで、
# alpha_vantageの予約枠を第2段階（絞り込み後の詳細フェッチ、既存のus_equityチェーンを使用）
# のために温存する。
#
# rate_limit_per_minute: 8（上のus_equityチェーンのtwelve_data候補と同じ理由、Basicプランの
# 実際の上限）。503銘柄 × 7.5秒間隔 ≈ 63分かかる計算になる（本ファイル最下部の運用上の
# 注意点、および項目6の会話ログ参照）。
us_equity_bulk_price:
  chain:
    - name: twelve_data
      rate_limit_per_day: 800
      rate_limit_per_minute: 8
      role: "primary_bulk_scan"

macro:
  chain:
    - name: fred

news:
  # 10章確定事項1「NewsAPIは開発・検証用途およびGDELT障害時の補助用途に限定。
  # 本番の主力はGDELT」の方針に沿い、GDELTを先に試す順序にしている
  # （NewsAPIを先に置いた設計書§3-3の設定例は、この方針との整合性を優先し補正した）。
  chain:
    - name: gdelt
      role: "production_primary"
    - name: newsapi
      rate_limit_per_day: 100
      environment: development_only   # 本番の毎朝実行での常用は規約上非推奨。GDELT障害時のみ使用
    - name: web_search_fallback
