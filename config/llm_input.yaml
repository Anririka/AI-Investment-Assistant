# layer2_analysis_design.md §3-10-1の確定仕様どおり。
# json_builder.pyがLayer5へ渡す候補件数の上限と、プロンプトのトークン予算を管理する。

candidate_limits:
  japan_equity: 10
  us_equity: 10
  etf: 5
  bond: 3
  gold: 3
  other: 3
max_total_candidates: 30   # 上記合計の目安上限（超過時は資産クラスごとの上限を優先し、超過分は警告ログに記録）

prompt_budget:
  # 2026-08-02更新：claudeを12000→20000に引き上げ。実運用ログで見積もりトークン数が
  # 12000を継続的に超過（14171〜23482、3日分の実測）しており、超過のたびに①各候補の
  # reason短縮（§3-10-1）が発動していた。20000であれば観測した3日分のうち大半を
  # reason短縮なしでカバーできる見込み（コスト増を抑えつつ、判断根拠の欠落を減らす
  # 折衷値。実測最大値23482を完全に吸収する25000までは上げない判断）。
  claude: 20000
  gpt: 8000
  gemini: 10000
# Layer5が未実装のため、現時点ではactive_providerを直接指定する（デフォルトclaude）。
# Layer5実装時にconfig/ai_provider.yamlとの参照解決に置き換える。
active_provider: "claude"
