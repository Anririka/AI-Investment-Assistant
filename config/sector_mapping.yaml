# 銘柄コード→セクターの対応表。
#
# 米国株（S&P500・503銘柄）：2026-08-12、GICS Sector（正式名称）で実データに差し替え済み。
# 情報源はWikipedia「List of S&P 500 companies」と、GitHub `datasets/s-and-p-500-companies`
# （独立した別データセット）の2ソースを突き合わせ、503銘柄中495銘柄で完全一致を確認した。
# 不一致だった2銘柄（APP・DD）は、stockanalysis.comを第3の情報源として多数決で確定した
# （APP=Communication Services、DD=Materials）。残り6銘柄（CPB・CAG・SATS・EA・EPAM・POOL）は
# 2ソース目のデータセットには含まれていなかった（直近のS&P500構成銘柄入替の反映タイミング
# 差と見られる。config/universe.yamlの銘柄リスト自体は2026-07-26時点のWikipediaスナップショット
# のままのため、実際の指数構成とズレが生じている可能性がある。この点はuniverse.yaml自体の
# 更新要否として別途確認が必要、本ファイルの範囲外）。
#
# 日本株（日経225・225銘柄）：まだ動作確認用のプレースホルダー5銘柄のみ。
# scripts/generate_sector_mapping.py（.github/workflows/generate_sector_mapping.yml経由で
# 実行）が東証33業種区分から実データを生成する。生成後、人間がレビューした上でこのファイルへ
# 統合する（layer5_ai_judgment §7-2、2026-08-12対応）。
#
# 未登録のtickerは load_portfolio_state.py 側で sector: "unknown" として集計する。

