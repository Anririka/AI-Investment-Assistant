# Layer1〜4（データ取得〜永続化）を実行するGitHub Actionsパイプライン。
# Phase0のsmoke test（環境構築・Secrets・Google Drive連携の確認）に加え、
# Phase1〜4（Layer1〜Layer4）のユニットテスト（tests/以下すべて）もここで自動実行する。
# Layer1〜4を実際に通しで実行する本番ステップ（実データ取得〜永続化）は、
# Layer5（Claude Coworkセッション側）の実装が固まったため、scripts/run_daily_pipeline.py
# として追加した（"Run daily pipeline"ステップ）。
#
# 注意：tests/layer5/・tests/layer6/・tests/layer7/ 配下のユニットテストもこの
# pytest ステップで一緒に実行される。Layer5（AI Agent実行層）・Layer6（レポート生成層、
# Ver1ではLayer5と同一Coworkセッション内で継続実行）はいずれもGitHub Actions上では動かず、
# Claude Coworkのスケジュールタスク側で稼働する（layer5_ai_judgment_design.md §0、
# layer6_report_generation_design.md §0）。ここでテストしているのは、それぞれが
# Bashツールで呼び出す決定的計算処理（scripts/*.py・formatters/等）のみ。
#
# Layer7（提案トラッキング層）・Layer8（自己評価層）はLayer1〜4と同様、GitHub Actions
# 上で動く独立したPythonパイプラインである（layer7_proposal_tracking_design.md §1、
# layer8_self_evaluation_design.md §1）が、Layer5/Layer6とは非同期の独自スケジュール
# （Layer8はLayer7完了後に続けて実行）で稼働するため、実行ジョブ自体は本ワークフロー
# ではなく別ファイル（tracking_pipeline.yml・evaluation_pipeline.yml）に分離してある。
# ユニットテストのみここで実行する。

name: Data Pipeline (Layer1-4)

on:
  workflow_dispatch: {}
  # 2026-07-26、実データ初回検証（Layer1〜8、GitHub Actions手動実行）完了に伴い有効化。
  # 2026-09-24改訂：当初は毎朝04:30 JST起動・6:30 JST起動のLayer5に対して2時間の
  # 余裕を見込んでいたが、実際のGoogle Drive上のlayer4_completed_YYYYMMDD.jsonの
  # completed_atを実測したところ、直近5日間（9/20〜9/24分）は04:30 JSTから完了まで
  # 3時間19分〜4時間26分かかっており、2時間の余裕では全く足りず、6:30 JST起動の
  # Layer5が5日連続でblocked（データ未準備）となっていたことが判明した（Layer5側の
  # Coworkスケジュールタスクとの会話ログ参照）。
  #
  # 2026-09-24再訂正：上記の「3時間19分〜4時間26分」の内訳を、GitHub Actions実行
  # 履歴（Actionsタブの各run行の開始時刻・所要時間表示）で確認したところ、当初
  # 想定していた「us_equity_bulk_price チェーン（Twelve Data Basicプランの
  # rate_limit_per_minute: 8、S&P500 503銘柄の第1段階スクリーニングで理論値約63分）
  # 等によるパイプライン自体の処理時間の長さ」が主因ではなかったことが分かった。
  # 実際のジョブ所要時間（Actions run行の実行時間表示）は毎回1時間15分〜1時間30分
  # 程度に過ぎず、大半の遅れの正体は、GitHub Actions側がscheduled（cronトリガー）の
  # 実行開始そのものを04:30 JST指定に対して2〜3時間ほど遅らせていたこと（実際の
  # 開始時刻はActions run行に"Sep 23, 07:20 GMT+9"等と表示され、04:30ではなく
  # 06:30〜07:40 JST頃に開始していた）にあった。GitHub Actionsの`schedule`トリガーは
  # 公式にも「混雑時は数十分〜数時間遅延し得るベストエフォートの仕組み」と説明されて
  # おり、これが今回の遅延の主因と考えられる。
  #
  # 対策（起動時刻の前倒し）自体は、「cronの指定時刻から実際の完了までのトータルの
  # 遅れ」の実測値（3時間19分〜4時間26分）を基準に決めたため、原因の内訳（処理時間か
  # 実行開始の遅延か）に関わらずそのまま有効である。実測の最大値（4時間26分）に
  # 対して1時間以上の安全マージンを確保するため、起動時刻を04:30 JSTから01:00 JST
  # （19:30 UTC前日→16:00 UTC前日）へ3時間30分前倒しする。これにより、同程度の
  # スケジュール遅延が今後も起きた場合でも、実開始は03:00〜04:00 JST頃、完了は
  # 04:15〜05:30 JST頃となる想定で、6:30 JST起動のLayer5がblockedにならず初回で
  # 提案作成まで完了できる見込み。
  #
  # ただし、GitHub Actionsのscheduled実行遅延はGitHub側の混雑状況に依存し、上限が
  # 保証されているものではない（前倒しだけで100%解消できる性質の遅延ではない）ため、
  # Layer5側の10:30・14:30 JSTでの再試行の仕組み（layer5_ai_judgment側の設計）は
  # 引き続き保険として維持する。将来的に遅延がさらに拡大する場合は、Actions run
  # 履歴の実開始時刻・所要時間を再確認のうえ、開始時刻をさらに前倒しするか、外部の
  # 呼び出しサービス（例：外部cron経由でのrepository_dispatch等、より時刻精度の高い
  # トリガー方式）への切り替えを検討する。
  schedule:
    - cron: "0 16 * * *"

jobs:
  phase0-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (Layer1 + Layer2 + Layer3 + Layer4 + Layer5 scripts + Layer6 scripts + Layer7 + Layer8)
        run: pytest tests -v

      - name: Phase0 smoke test (config load + Google Drive connectivity)
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python scripts/phase0_smoke_test.py

      - name: Layer1 live data check (real APIs, small sample)
        # モックテストでは検証できない、実ライブAPIレスポンスとのフィールド名の
        # ズレを早期発見するための疎通確認。失敗してもジョブ全体は失敗させない
        # （フィールド名調整が必要なだけの場合があるため。ログを確認して対応する）。
        continue-on-error: true
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
        run: python scripts/layer1_live_check.py

      - name: Run daily pipeline (Layer1 real fetch -> Layer3 -> Layer2 -> Layer4 persist)
        # Layer1〜4を実データで通しで実行する本番ステップ（scripts/run_daily_pipeline.py参照）。
        # 1銘柄・1データソースの障害はwarning_errors/excluded_summaryに記録して継続する設計だが、
        # Google Drive永続化（Layer4）自体が失敗した場合はジョブを失敗させ、異常に気づけるようにする。
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_daily_pipeline.py
