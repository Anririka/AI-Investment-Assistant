# Layer8（自己評価層）を実行するGitHub Actionsパイプライン
# （layer8_self_evaluation_design.md §1・§4）。
#
# Layer8はAIによる新たな投資判断を一切行わない決定的Python処理であり、
# 「Layer7完了後に続けて実行される独立したスケジュールジョブ」として設計されている
# （§1）。Layer7の完了フラグ（tracking/layer7_completed_YYYYMMDD.json）を起動直後に
# 確認するため（§4-3）、実運用では本ワークフローをtracking_pipeline.ymlの後続に
# 位置づける（例：Layer7のジョブ完了後、一定時間を空けて実行、またはworkflow_run
# トリガーでの連結を将来検討）。
#
# 2026-07-26追加：Layer8の実際の実行ステップを`scripts/run_layer8_evaluation.py`として
# 追加した（data_pipeline.ymlの`scripts/run_daily_pipeline.py`、tracking_pipeline.yml
# の`scripts/run_layer7_tracking.py`と同じ構成方針）。Google Drive/Sheetsへのアクセス
# のみで価格取得APIは使わないため、data_pipeline.ymlと同じGOOGLE_OAUTH_TOKEN_JSON／
# GOOGLE_DRIVE_FOLDER_IDのみで動作する（新規のAPIキー・secretsは不要）。
#
# concurrency設定：evaluation/配下の各JSONファイルはread-modify-write方式で更新するため、
# 同一実行単位が重複起動しないことを前提とする（§6）。

name: Self Evaluation (Layer8)

on:
  workflow_dispatch: {}
  # 2026-07-26、実データ初回検証（Layer1〜8、GitHub Actions手動実行）完了に伴い有効化。
  # 毎営業日16:00 JST = 07:00 UTC（Layer7の完了を見込める時刻）。
  schedule:
    - cron: "0 7 * * 1-5"

concurrency:
  group: layer8-evaluation
  cancel-in-progress: false

jobs:
  evaluation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (Layer8)
        run: pytest tests/layer8 -v

      - name: Run Layer8 evaluation pipeline (real Google Drive/Sheets)
        # Layer7完了フラグが無い／completed:falseの場合や、未評価のクローズ済み
        # ポジションが0件の場合は正常にスキップされる（exit 0）設計（§4手順2・5）。
        # Google Driveへの保存自体が失敗した場合のみジョブを失敗させる。
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python scripts/run_layer8_evaluation.py
